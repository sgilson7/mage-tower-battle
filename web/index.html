<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src 'self' keeps fetches on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. A meta policy cannot stop data
       leaving by navigation, so the browser check still watches requests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss://nos.lol wss://nostr.mom wss://relay.damus.io wss://relay.primal.net wss://nostr-01.yakihonne.com wss://nostr.sathoarder.com wss://relay.mostro.network; style-src 'self'; img-src 'self' data:; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mage Tower Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false">
  <main id="stage">
    <canvas id="gl"></canvas>
    <canvas id="overlay" hidden></canvas>
    <div id="labels"></div>
    <div id="panels"></div>
    <div id="toasts" role="status"></div>
    <div id="card" role="status"></div>
    <p id="message" role="alert"></p>
    <section id="ask" class="panel" hidden></section>
    <button id="glossary-button" class="act"></button>
    <button id="mute" class="act"></button>
  </main>
  <noscript><p>This game needs JavaScript, WebAssembly and WebGL 2.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
